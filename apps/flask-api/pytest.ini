[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
norecursedirs = test_all_exam_levels.py test_api_applications.sh load_test.py

# Priority markers - organize tests by importance
markers =
    critical: Critical tests - must always pass (core functionality)
    important: Important tests - should run in CI (major features)
    extended: Extended tests - nice to have (edge cases, extras)

# Category markers - organize by feature area
    auth: Authentication tests
    admission: Admission pathway tests
    admin: Admin operation tests
    career: Career portal tests
    pathway: Education pathway tests
