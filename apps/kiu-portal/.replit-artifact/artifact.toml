kind = "web"
previewPath = "/"
title = "KIU Admission & Career Portal"
version = "1.0.0"
id = "apps/kiu-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26243

[services.development]
run = "pnpm --filter @workspace/kiu-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kiu-portal", "run", "build" ]
publicDir = "apps/kiu-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26243"
BASE_PATH = "/"
