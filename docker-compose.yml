# KIU Admission Portal - Docker Compose Configuration
# Production-ready setup with database, API, and frontend

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: kiu-postgres
    environment:
      POSTGRES_DB: kiu_portal
      POSTGRES_USER: kiu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiu_user -d kiu_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiu-network

  # Flask API Backend
  api:
    build:
      context: ./apps/flask-api
      dockerfile: Dockerfile
    container_name: kiu-api
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://kiu_user:${DB_PASSWORD:-changeme_secure_password}@db:5432/kiu_portal
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Payment Gateway Configuration
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      # SMS Configuration
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-KIU-PORTAL}
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "5001:5001"
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kiu-network
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./apps/kiu-portal
      dockerfile: Dockerfile
    container_name: kiu-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - kiu-network
    restart: unless-stopped

  # Redis Cache (optional - for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: kiu-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kiu-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kiu-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - api_uploads:/var/www/uploads:ro
    depends_on:
      - api
      - frontend
    networks:
      - kiu-network
    restart: unless-stopped

  # Database Backup Service
  backup:
    image: postgres:15-alpine
    container_name: kiu-backup
    environment:
      PGHOST: db
      PGUSER: kiu_user
      PGPASSWORD: ${DB_PASSWORD:-changeme_secure_password}
      PGDATABASE: kiu_portal
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup_database.py:/scripts/backup.py:ro
    command: >
      sh -c "echo '0 2 * * * python /scripts/backup.py' | crontab - && crond -f"
    depends_on:
      - db
    networks:
      - kiu-network

volumes:
  postgres_data:
  api_logs:
  api_uploads:
  redis_data:

networks:
  kiu-network:
    driver: bridge
