packages:
  "framer-motion": "For page transitions, smooth form step animations, and dashboard micro-interactions"
  "react-hook-form": "For robust handling of complex admission and profile forms"
  "@hookform/resolvers": "Zod integration for react-hook-form validation"
  "zod": "Schema definition and validation for all forms"
  "date-fns": "For formatting dates in application timelines and opportunity deadlines"
  "lucide-react": "For crisp, consistent iconography across dashboards and forms"
  "clsx": "For conditional class merging"
  "tailwind-merge": "For resolving Tailwind CSS class conflicts safely"

images:
  - path: "artifacts/kiu-portal/public/images/hero-bg.png"
    description: "Professional, majestic university campus building with classical architecture, bathed in warm golden hour light, blue sky, high resolution, academic atmosphere"
    aspect_ratio: "16:9"
  - path: "artifacts/kiu-portal/public/images/logo.png"
    description: "Elegant academic crest logo featuring a shield with deep blue and gold colors, minimal and modern institutional design, isolated on transparent background"
    aspect_ratio: "1:1"
  - path: "artifacts/kiu-portal/public/images/abstract-academic.png"
    description: "Abstract geometric background in deep oxford blue and golden yellow accents, subtle gradient mesh, professional institutional feel"
    aspect_ratio: "16:9"

notes:
  - "The API is available at /api and requires Bearer token authentication."
  - "Tokens are stored in localStorage as 'kiu_token'."
  - "Since Orval-generated hooks use customFetch, a window.fetch patch is used to inject the Authorization header automatically."
  - "The app uses wouter for routing and TanStack query for state management."
